/* Layout: trilho lateral no desktop, barra inferior no celular; mês e ano escolhidos no topo comandam todas as telas. */
:root {
  --bg: #e8f3f9; --surface: #ffffff; --surface-2: #f0f8fc; --ink: #0b1f33; --ink-2: #33485e; --muted: #526a80;
  --line: #cde0ea; --grid: #deecf3; --accent: #0069b4; --accent-ink: #ffffff; --accent-soft: #d6ebfa;
  --accent-2: #ff6a2b; --teal: #00a99d; --rail-1: #05223c; --rail-2: #0a5a94; --grad: linear-gradient(135deg, #0069b4 0%, #00a99d 100%); --grad-sun: linear-gradient(135deg, #ff5a1f 0%, #ffa23a 100%);
  --pago: #d4142a; --pago-soft: #ffe3e6; --aberto: #0a8a3c; --aberto-soft: #d8f5e2; --warn: #b35300; --warn-soft: #ffeccf;
  --c0: #8e3ccf; --c1: #1e88e5; --c2: #3f9a3f; --c3: #c77c00; --c4: #e0262d; --c5: #009a8f; --c6: #8a4b2a; --c7: #5a5fb0; --c8: #b0407a; --c9: #5f6b7a;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
  --shadow: 0 2px 4px rgba(5, 34, 60, .06), 0 10px 26px rgba(5, 34, 60, .09);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061826; --surface: #0d2437; --surface-2: #12304a; --ink: #e9f4fb; --ink-2: #bcd3e3; --muted: #8eaec4;
    --line: #1c3d58; --grid: #173449; --accent: #38b6ff; --accent-ink: #04121d; --accent-soft: #0f3a58;
    --pago: #ff6b78; --pago-soft: #3e1a22; --aberto: #4ee08a; --aberto-soft: #0f3322; --warn: #ffb04a; --warn-soft: #3d2a10;
    --c0: #c792f0; --c1: #5bb4ff; --c2: #7edc7e; --c3: #ffc247; --c4: #ff7f87; --c5: #3fdccd; --c6: #d9936c; --c7: #9ea3ee; --c8: #e58ab8; --c9: #a3b0bf;
    --shadow: 0 2px 4px rgba(0, 0, 0, .35), 0 10px 26px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061826; --surface: #0d2437; --surface-2: #12304a; --ink: #e9f4fb; --ink-2: #bcd3e3; --muted: #8eaec4;
  --line: #1c3d58; --grid: #173449; --accent: #38b6ff; --accent-ink: #04121d; --accent-soft: #0f3a58;
  --pago: #ff6b78; --pago-soft: #3e1a22; --aberto: #4ee08a; --aberto-soft: #0f3322; --warn: #ffb04a; --warn-soft: #3d2a10;
  --c0: #c792f0; --c1: #5bb4ff; --c2: #7edc7e; --c3: #ffc247; --c4: #ff7f87; --c5: #3fdccd; --c6: #d9936c; --c7: #9ea3ee; --c8: #e58ab8; --c9: #a3b0bf;
  --shadow: 0 2px 4px rgba(0, 0, 0, .35), 0 10px 26px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--f-display); font-size: 21px; letter-spacing: -.01em; color: var(--accent); }
.brand span { font-size: 11.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; border: 0; background: none; padding: 10px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 500; text-align: left; }
.nav button svg { width: 19px; height: 19px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; font-size: 12px; color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.top h1 { font-size: 22px; margin-right: auto; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button, .stepper select { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; }
.stepper button { width: 36px; padding: 0; font-size: 18px; line-height: 1; }
.stepper select { font-weight: 600; }
.stepper button.btn { width: auto; font-size: 14px; padding: 0 12px; }
.cols2 { align-items: start; }
.btn { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: none; }
.btn.danger { color: var(--pago); border-color: var(--pago); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.content { padding: 20px max(20px, env(safe-area-inset-right, 0px)) 48px 20px; display: flex; flex-direction: column; gap: 18px; max-width: 1240px; width: 100%; }

.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 12px; }
.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 25px; font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.main-kpi { background: var(--accent); border-color: var(--accent); }
.kpi.main-kpi .l, .kpi.main-kpi .s { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }
.kpi.main-kpi .v { color: var(--accent-ink); }
.t-pago { color: var(--pago); } .t-aberto { color: var(--aberto); } .t-warn { color: var(--warn); }

.pill { border: 1px solid currentColor; border-radius: 999px; padding: 2px 11px; font-weight: 600; font-size: 12.5px; background: none; min-width: 66px; }
.pill.pago { color: var(--pago); background: var(--pago-soft); }
.pill.aberto { color: var(--aberto); background: var(--aberto-soft); }
.pill[disabled] { cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--cc, var(--c9)); white-space: nowrap; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--cc, var(--c9)); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(78px, 130px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .tr { height: 12px; background: var(--grid); border-radius: 6px; overflow: hidden; display: flex; }
.bar-row .tr i { display: block; height: 100%; background: var(--cc, var(--accent)); }
.bar-row .tr i.p { background: var(--pago); } .bar-row .tr i.a { background: var(--aberto); }
.bar-row .val { text-align: right; white-space: nowrap; }
.bar-row .val small { color: var(--muted); font-family: var(--f-body); margin-left: 6px; }
.split { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: var(--grid); margin-bottom: 12px; }
.split i { display: block; height: 100%; }
.legend { display: grid; gap: 8px; }
.legend div { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; }
.legend b { width: 12px; height: 12px; border-radius: 3px; display: block; }
.legend .q { color: var(--muted); font-size: 12px; min-width: 56px; text-align: right; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .sel { fill: var(--accent-soft); }
.chart rect.hit { fill: transparent; cursor: pointer; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--k); vertical-align: -1px; }

.alerts { display: grid; gap: 6px; }
.alert-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.alert-row.late { background: var(--pago-soft); }
.alert-row .d { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.alert-row .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin: 4px 0; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select, .toolbar input[type="search"] { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; min-width: 0; }
.toolbar input[type="search"] { flex: 1 1 180px; }
.toolbar .sp { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 14px; height: 34px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.conta { display: grid; grid-template-columns: 46px minmax(150px, 1.5fr) minmax(110px, .9fr) 118px 88px minmax(120px, .9fr) 150px; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.conta:last-child { border-bottom: 0; }
.conta.head { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding-block: 8px; position: static; }
.conta.late { background: var(--pago-soft); }
.conta .dia { font-family: var(--f-num); font-weight: 500; color: var(--accent); }
.conta .desc { min-width: 0; display: flex; flex-direction: column; }
.conta .desc strong { font-weight: 600; overflow-wrap: anywhere; }
.conta .desc em { font-style: normal; font-size: 12px; color: var(--warn); }
.conta .fp { font-size: 12px; color: var(--muted); }
.conta .parc small { display: block; color: var(--muted); font-size: 11.5px; font-family: var(--f-body); }
.conta .val { text-align: right; font-weight: 500; }
.conta .act { display: flex; gap: 6px; justify-content: flex-end; }
.list { padding: 0; overflow: hidden; }
.sumline { display: flex; flex-wrap: wrap; gap: 6px 24px; padding: 12px 14px; background: var(--surface-2); border-top: 1px solid var(--line); font-size: 13px; }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 600; background: var(--surface-2); }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr.cur td { background: var(--accent-soft); font-weight: 600; }
.tbl tfoot td { font-weight: 600; background: var(--surface-2); border-bottom: 0; }
.tbl td.wrap { white-space: normal; min-width: 160px; }
.mono-tag { font-family: var(--f-num); }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 22, .55); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: min(560px, 100%); padding: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-size: 19px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field input, .field select { height: 38px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 0 10px; width: 100%; min-width: 0; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.preview { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.err { background: var(--pago-soft); color: var(--pago); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; max-width: calc(100vw - 32px); }
.banner { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius); padding: 12px 14px; }
.lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 6px 6px 10px; font-size: 13px; }
.tag button { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; }
.tag button:hover { color: var(--pago); }
.addrow { display: flex; gap: 8px; margin-top: 12px; }
.addrow input { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 0 10px; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

.saved { font-size: 12.5px; font-weight: 600; color: var(--aberto); white-space: nowrap; }
.tabbar { display: none; }
@media (max-width: 1020px) {
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols2, .lists { grid-template-columns: minmax(0, 1fr); }
  .conta { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: "dia desc val" "dia parc sit" "dia cat act"; gap: 4px 10px; }
  .conta.head { display: none; }
  .conta .dia { grid-area: dia; align-self: start; padding-top: 2px; }
  .conta .desc { grid-area: desc; } .conta .parc { grid-area: parc; } .conta .val { grid-area: val; }
  .conta .sit { grid-area: sit; justify-self: end; } .conta .catc { grid-area: cat; } .conta .act { grid-area: act; }
  .conta .vcell { display: none; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top h1 { flex-basis: 100%; font-size: 20px; }
  .content { padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .grid3 { grid-template-columns: minmax(0, 1fr); }
  .kpi .v { font-size: 21px; }
  .btn .lbl { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 10px; color: var(--muted); font-weight: 500; border-radius: 8px; min-width: 0; }
  .tabbar button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  .fgrid { grid-template-columns: minmax(0, 1fr); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}

/* Tema vivo: oceano, turquesa e pôr do sol */
body { background-image: radial-gradient(900px 420px at 105% -8%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent), radial-gradient(800px 380px at -5% 0%, color-mix(in srgb, var(--teal) 14%, transparent), transparent); background-attachment: fixed; }
.rail { background: linear-gradient(185deg, var(--rail-1) 0%, var(--rail-2) 100%); border-right: 0; color: #fff; }
.brand b { font-size: 25px; background: var(--grad-sun); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand span { color: rgba(255, 255, 255, .7); }
.nav button { color: rgba(255, 255, 255, .85); }
.nav button:hover { background: rgba(255, 255, 255, .12); }
.nav button[aria-current="page"] { background: var(--grad-sun); color: #fff; box-shadow: 0 6px 16px rgba(255, 90, 31, .4); }
.rail-foot { color: rgba(255, 255, 255, .7); }
.rail-foot .btn { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .3); }
.top { background: var(--surface); border-bottom: 3px solid transparent; border-image: var(--grad) 1; box-shadow: 0 6px 18px rgba(5, 34, 60, .08); }
.top h1 { font-size: 25px; }
.btn.primary { background: var(--grad-sun); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(255, 90, 31, .35); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary[disabled] { filter: grayscale(.6); opacity: .6; }
.seg button[aria-pressed="true"] { background: var(--grad); color: #fff; }
.card { border-radius: 14px; box-shadow: var(--shadow); }
.card.kpi { border-top: 4px solid var(--accent); }
.card.kpi:has(.v.t-pago) { border-top-color: var(--pago); }
.card.kpi:has(.v.t-aberto) { border-top-color: var(--aberto); }
.card.kpi:has(.v.t-warn) { border-top-color: var(--warn); }
.kpi.main-kpi { background: var(--grad); border: 0; box-shadow: 0 12px 28px rgba(0, 105, 180, .38); }
.kpi.main-kpi .l, .kpi.main-kpi .s { color: rgba(255, 255, 255, .82); }
.kpi.main-kpi .v { color: #fff; font-size: clamp(20px, 5.6vw, 28px); }
.kpi .v { font-weight: 600; }
.bar-row .tr { height: 14px; }
.bar-row .tr i { background: var(--cc, linear-gradient(90deg, var(--accent), var(--teal))); border-radius: 7px; }
.split { height: 20px; }
.pill.pago { background: var(--pago); color: #fff; border-color: var(--pago); }
.pill.aberto { background: var(--aberto); color: #fff; border-color: var(--aberto); }
.chip::before { width: 11px; height: 11px; border-radius: 4px; }
.tbl tr.cur td { background: var(--accent-soft); }
.tbl th { color: var(--ink-2); }
.conta .dia { color: var(--accent-2); font-weight: 600; }
.tabbar { box-shadow: 0 -6px 18px rgba(5, 34, 60, .12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.pago, :root:not([data-theme="light"]) .pill.aberto { color: #04121d; } }
:root[data-theme="dark"] .pill.pago, :root[data-theme="dark"] .pill.aberto { color: #04121d; }
.tabbar button[aria-current="page"] { background: var(--grad-sun); color: #fff; }

/* Visual "Loja": azul-noite com laranja, as cores da Lavanderia Dunas */
:root[data-look="loja"] {
  --bg: #07142b; --surface: #0d2145; --surface-2: #122b57; --ink: #f3f7ff; --ink-2: #c9d6ee; --muted: #9bb0d3;
  --line: #1f3d73; --grid: #183260; --accent: #ff8a1f; --accent-ink: #1a0b00; --accent-soft: #3b2a14;
  --accent-2: #ff8a1f; --teal: #ffb347; --rail-1: #040c1c; --rail-2: #0a2150;
  --grad: linear-gradient(135deg, #d9530a 0%, #f58a1f 100%); --grad-sun: linear-gradient(135deg, #ff7a1a 0%, #ffb347 100%);
  --pago: #ff6b78; --pago-soft: #3e1a2a; --aberto: #4ee08a; --aberto-soft: #0f3a2c; --warn: #ffc247; --warn-soft: #3d2f12;
  --c0: #c792f0; --c1: #5bb4ff; --c2: #7edc7e; --c3: #ffc247; --c4: #ff7f87; --c5: #3fdccd; --c6: #d9936c; --c7: #9ea3ee; --c8: #e58ab8; --c9: #a3b0bf;
  --shadow: 0 2px 4px rgba(0, 0, 0, .4), 0 10px 26px rgba(0, 0, 0, .35); color-scheme: dark;
}
:root[data-look="loja"] .pill.pago, :root[data-look="loja"] .pill.aberto { color: #04121d; }
:root[data-look="loja"] .kpi.main-kpi .l, :root[data-look="loja"] .kpi.main-kpi .s { color: #fff; }
:root[data-look="loja"] .top { box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }

.hero { position: relative; border-radius: 16px; overflow: hidden; min-height: 170px; display: flex; align-items: flex-end; background: #07142b var(--hero-img) center / cover no-repeat; box-shadow: var(--shadow); }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5, 14, 32, .92) 0%, rgba(5, 14, 32, .55) 55%, rgba(5, 14, 32, .15) 100%); }
.hero > div { position: relative; padding: 20px 24px; color: #fff; display: flex; flex-direction: column; gap: 4px; }
.hero b { font-family: var(--f-display); font-size: 26px; letter-spacing: -.01em; }
.hero span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #ffb347; font-weight: 600; }
@media (max-width: 760px) { .hero { min-height: 130px; } .hero > div { padding: 16px 18px; } .hero b { font-size: 21px; } }
@media (prefers-reduced-motion: no-preference) { .modal { animation: fade .12s ease-out; } @keyframes fade { from { opacity: 0; } } }

    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(ariaLabel) + '">';
    for (var i = 0; i <= 4; i++) { var y = T + ih - (ih * i) / 4; s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + kfmt((mx * i) / 4) + "</text>"; }
    labels.forEach(function (lb, k) { if (n <= 12 || k % 3 === 0) s += '<text x="' + (L + k * step) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lb) + "</text>"; });
    series.forEach(function (sr) {

    });

  function dayBars(ano, mes) {

    var rs = monthRows(ano, mes), data = [];
    for (var d = 1; d <= 31; d++) data.push({ p: sum(rs, function (r) { return r.dia === d && isPago(r); }), a: sum(rs, function (r) { return r.dia === d && isAberto(r); }) });
    var mx = niceMax(Math.max.apply(null, [1].concat(data.map(function (x) { return x.p + x.a; }))));

    for (var i = 0; i <= 4; i++) { var y = T + ih - (ih * i) / 4; s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + kfmt((mx * i) / 4) + "</text>"; }
    data.forEach(function (x, k) {

      s += '<rect x="' + (px + 1.5) + '" y="' + (T + ih - hp - ha) + '" width="' + (bw - 3) + '" height="' + ha + '" fill="var(--aberto)"><title>Dia ' + (k + 1) + ": em aberto " + brl(x.a) + "</title></rect>";
      if ((k + 1) % 5 === 0 || k === 0) s += '<text x="' + (px + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle">' + (k + 1) + "</text>";

    return s + "</svg>" + '<div class="key"><span style="--k:var(--pago)">Pago</span><span style="--k:var(--aberto)">Em aberto</span></div>';
  }

    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1500);
  }
  function backupJson() { if (CLOUD) return cloudBackup(); return JSON.stringify({ app: "edson-contas", versao: 1, exportadoEm: new Date().toISOString(), dados: store }); }
  /* ---------- nuvem (Firebase): login + sincronização ---------- */
  var CLOUD = false, fbAuth = null, fbFs = null, fbUid = null;
  function fbReady() { var c = window.FIREBASE_CONFIG; return !!(window.firebase && c && c.apiKey && c.projectId); }
  function cloudDb(uid) {
    var root = "users/" + uid + "/", noop = function () {};
    return {
      collection: function (name) {
        var c = fbFs.collection(root + name);
        return {
          onSnapshot: function (next) { c.onSnapshot(next, noop); },
          doc: function (id) { return id ? c.doc(id) : c.doc(); }
        };
      },
      doc: function (path) {
        var d = fbFs.doc(root + path);
        return { onSnapshot: function (next) { d.onSnapshot(next, noop); }, set: function (v) { return d.set(v); } };
      }
    };
  }
  async function cloudImport(pi) {
    var root = "users/" + fbUid + "/", ops = [];
    var snap = await fbFs.collection(root + "lancamentos").get();
    snap.docs.forEach(function (d) { ops.push(function (b) { b.delete(d.ref); }); });
    Object.keys(pi.lancamentos || {}).forEach(function (id) { ops.push(function (b) { b.set(fbFs.doc(root + "lancamentos/" + id), pi.lancamentos[id]); }); });
    if (pi["config/listas"] && Object.keys(pi["config/listas"]).length) ops.push(function (b) { b.set(fbFs.doc(root + "config/listas"), pi["config/listas"]); });
    if (pi["config/metas"] && Object.keys(pi["config/metas"]).length) ops.push(function (b) { b.set(fbFs.doc(root + "config/metas"), pi["config/metas"]); });
    for (var i = 0; i < ops.length; i += 400) { var b = fbFs.batch(); ops.slice(i, i + 400).forEach(function (f) { f(b); }); await b.commit(); }
  }
  function cloudBackup() {
    var l = {}; st.rows.forEach(function (r) { l[r.id] = { ano: r.ano, mes: r.mes, descricao: r.descricao, dia: r.dia, valor: r.valor, parcela: r.parcela, situacao: r.situacao, categoria: r.categoria, forma: r.forma || "", ord: r.ord || 0 }; });
    return JSON.stringify({ app: "edson-contas", versao: 1, exportadoEm: new Date().toISOString(), dados: { lancamentos: l, "config/listas": { categorias: cats(), descricoes: descList(), formas: formas() }, "config/metas": st.metas || {} } });
  }
  var LOGIN_MSG = { "auth/invalid-credential": "E-mail ou senha incorretos.", "auth/wrong-password": "E-mail ou senha incorretos.", "auth/user-not-found": "E-mail ou senha incorretos.", "auth/invalid-email": "E-mail inválido.", "auth/email-already-in-use": "Esse e-mail já tem conta. Use Entrar.", "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.", "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo.", "auth/network-request-failed": "Sem internet. Conecte e tente de novo.", "auth/operation-not-allowed": "Criação de conta desativada." };
  function loginUi() {
    var box = document.getElementById("login"), msg = document.getElementById("lg-msg"), go = document.getElementById("lg-go");
    var lg = document.querySelector('link[rel="apple-touch-icon"]'); if (lg) document.getElementById("login-logo").src = lg.href;
    function say(t, ok) { msg.textContent = t || ""; msg.className = "msg" + (ok ? " ok" : ""); }
    function err(e) { say(LOGIN_MSG[e && e.code] || "Não foi possível entrar. Tente novamente."); go.disabled = false; }
    function cred() { return [document.getElementById("lg-email").value.trim(), document.getElementById("lg-pass").value]; }
    document.getElementById("login-form").addEventListener("submit", function (ev) {
      ev.preventDefault(); var c = cred(); go.disabled = true; say("Entrando…", true);
      fbAuth.signInWithEmailAndPassword(c[0], c[1]).catch(err);
    });
    document.getElementById("lg-new").addEventListener("click", function () {
      var c = cred(); if (!c[0] || c[1].length < 6) { say("Preencha e-mail e uma senha de 6+ caracteres e toque em Criar conta."); return; }
      go.disabled = true; say("Criando conta…", true); fbAuth.createUserWithEmailAndPassword(c[0], c[1]).catch(err);
    });
    document.getElementById("lg-reset").addEventListener("click", function () {
      var c = cred(); if (!c[0]) { say("Digite seu e-mail e toque em Esqueci a senha."); return; }
      fbAuth.sendPasswordResetEmail(c[0]).then(function () { say("Enviamos um e-mail para redefinir a senha.", true); }).catch(err);
    });
    return { show: function () { box.classList.add("on"); go.disabled = false; }, hide: function () { box.classList.remove("on"); } };
  }
  var dataStarted = false;
  async function boot() {
    if (!fbReady()) { toast("Firebase não configurado: modo local (sem sincronizar)."); return bootData(localDb); }
    if (document.readyState === "loading") await new Promise(function (r) { document.addEventListener("DOMContentLoaded", r); });
    firebase.initializeApp(window.FIREBASE_CONFIG);
    fbAuth = firebase.auth(); fbFs = firebase.firestore();
    try { await fbFs.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
    var ui = loginUi();
    document.addEventListener("click", function (ev) {
      var t = ev.target.closest && ev.target.closest('[data-act="logout"]');
      if (t) fbAuth.signOut().then(function () { location.reload(); });
    });
    fbAuth.onAuthStateChanged(function (u) {
      if (!u) { ui.show(); return; }
      ui.hide(); fbUid = u.uid; CLOUD = true;
      if (!dataStarted) { dataStarted = true; bootData(cloudDb(u.uid)); }
    });
  }
  async function bootData(db) {
    downloads = { save: async function (o) { saveBlob(o.filename, o.data instanceof Blob ? o.data : new Blob([o.data])); } };
    col = db.collection("lancamentos"); cfgRef = db.doc("config/listas"); metaRef = db.doc("config/metas");
    metaRef.onSnapshot(function (s) { st.metas = s.exists ? (s.data() || {}) : {}; schedule(); });
    col.onSnapshot(function (snap) {
      st.rows = snap.docs.map(function (d) { var o = d.data() || {}; return enrich({ id: d.id, ano: +o.ano, mes: +o.mes, descricao: String(o.descricao || ""), dia: +o.dia || 1, valor: +o.valor || 0, parcela: String(o.parcela == null ? "-" : o.parcela), situacao: o.situacao === "Pago" ? "Pago" : "Aberto", categoria: String(o.categoria || ""), forma: String(o.forma || ""), ord: +o.ord || 0 }); });
      st.ready = true; schedule();
    });
    cfgRef.onSnapshot(function (s) { var o = s.exists ? s.data() : null; st.cats = o && Array.isArray(o.categorias) ? o.categorias : null; st.descs = o && Array.isArray(o.descricoes) ? o.descricoes : []; st.formas = o && Array.isArray(o.formas) ? o.formas : null; st.listasReady = true; schedule(); });
  }
  boot();
})();
</script>
<div id="login" role="dialog" aria-label="Entrar"><form class="box" id="login-form" autocomplete="on">
<img class="logo" id="login-logo" alt="" src="">
<h1>Edson Costa</h1><p class="sub">Contas a Pagar</p>
<label for="lg-email">E-mail</label><input id="lg-email" type="email" autocomplete="username" required>
<label for="lg-pass">Senha</label><input id="lg-pass" type="password" autocomplete="current-password" required>
<button class="go" id="lg-go" type="submit">Entrar</button>
<div class="msg" id="lg-msg" role="status"></div>
<div class="links"><button type="button" id="lg-new">Criar conta</button><button type="button" id="lg-reset">Esqueci a senha</button></div>
</form></div>
</body></html>
